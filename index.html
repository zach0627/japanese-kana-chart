<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日本50音生活例句互動背誦表</title>
<style>body{margin:0;display:grid;place-items:center;min-height:100vh;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#loading{padding:24px;text-align:center;line-height:1.7}</style>
</head>
<body>
<div id="loading">正在載入修正版日本50音互動背誦表…</div>
<script>
(async()=>{
  try{
    const paths=['001','002','003','004','005'].map(n=>`chunks/part-${n}`);
    const responses=await Promise.all(paths.map(path=>fetch(path,{cache:'no-store'})));
    if(responses.some(response=>!response.ok))throw new Error('chunks load failed');
    let page=(await Promise.all(responses.map(response=>response.text()))).join('');
    const stylesheet='<link rel="stylesheet" href="layout-v4.css?v=20260724-final-header-fix">';
    const cleanup=`<script id="remove-legacy-table-header">(()=>{const fix=()=>{document.querySelectorAll('thead').forEach(n=>n.remove());document.querySelectorAll('.toolbar,th').forEach(n=>{n.style.setProperty('position','static','important');n.style.setProperty('top','auto','important');n.style.setProperty('z-index','auto','important')})};fix();document.addEventListener('DOMContentLoaded',fix,{once:true});new MutationObserver(fix).observe(document.documentElement,{childList:true,subtree:true})})();<\/script>`;
    if(!page.includes('</head>')||!page.includes('</body>'))throw new Error('invalid page');
    page=page.replace('</head>',stylesheet+'</head>');
    page=page.replace('</body>',cleanup+'</body>');
    document.open();document.write(page);document.close();
  }catch(error){
    document.getElementById('loading').innerHTML='頁面載入失敗，請重新整理後再試一次。';
    console.error(error);
  }
})();
</script>
</body>
</html>
