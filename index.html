<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="description" content="日本50音平假名、片假名、生活單字、例句、逐詞拼讀與發音練習">
  <title>日本50音生活例句互動背誦表</title>
  <link rel="stylesheet" href="assets/styles.css?v=6">
  <script src="assets/app.js?v=6" defer></script>
</head>
<body>
  <main class="shell" id="app">
    <header class="hero">
      <p class="eyebrow">JAPANESE KANA STUDY</p>
      <h1>日本50音生活例句互動背誦表</h1>
      <p class="lead">每個基本音都附平假名、片假名、生活單字、完整例句與逐詞拼讀。先看卡片練習，再展開例句核對發音與用法。</p>
      <div class="legend">
        <span class="legend-chip h">平假名：原生單字與文法</span>
        <span class="legend-chip k">片假名：外來語、品牌與強調</span>
      </div>
    </header>

    <section class="toolbar-wrap" aria-label="學習工具">
      <div class="toolbar">
        <label class="search-wrap">
          <span class="sr-only">搜尋</span>
          <input id="search" class="search" type="search" placeholder="搜尋假名、單字、中文或例句" autocomplete="off">
        </label>
        <div class="controls">
          <select id="groupFilter" class="select" aria-label="篩選行">
            <option value="">全部行</option><option>あ行</option><option>か行</option><option>さ行</option><option>た行</option><option>な行</option><option>は行</option><option>ま行</option><option>や行</option><option>ら行</option><option>わ行</option>
          </select>
          <select id="viewFilter" class="select" aria-label="顯示假名類型">
            <option value="both">平假名＋片假名</option><option value="hiragana">只看平假名</option><option value="katakana">只看片假名</option>
          </select>
          <button id="expandAll" class="control" type="button">展開全部</button>
          <button id="collapseAll" class="control" type="button">收合全部</button>
          <button id="toggleRomaji" class="control" type="button">隱藏羅馬字</button>
          <button id="practice" class="control" type="button">測驗模式</button>
          <button id="stop" class="control" type="button">停止發音</button>
          <button class="control" type="button" onclick="window.print()">列印</button>
        </div>
        <output id="status" class="status" aria-live="polite">載入中…</output>
      </div>
    </section>

    <section id="content" aria-live="polite">
      <div class="empty">正在載入50音資料…</div>
    </section>

    <aside class="note">
      <strong>練習方式：</strong>先自己念假名與單字，再播放發音核對。展開例句後，按照「日文、假名分拍、羅馬字、中文」逐詞拼回完整句子。句子中的助詞「は」通常念 wa，「を」通常念 o。
    </aside>
  </main>
</body>
</html>
