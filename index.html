<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>日本50音生活例句互動背誦表</title>
  <style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#f5f7fb;color:#172033}#loading{padding:24px;text-align:center;line-height:1.7}</style>
</head>
<body>
  <div id="loading">正在載入日本50音互動背誦表…</div>
  <script>
    (async()=>{
      try{
        const paths=['001','002','003','004','005'].map(n=>`chunks/part-${n}`);
        const responses=await Promise.all(paths.map(path=>fetch(path,{cache:'no-store'})));
        if(responses.some(response=>!response.ok)) throw new Error('load');
        let page=(await Promise.all(responses.map(response=>response.text()))).join('');
        const css=String.raw`:root{--v4-line:#dce3ed;--v4-ink:#172033;--v4-muted:#69758a;--v4-h:#fff4f6;--v4-h2:#f3cbd3;--v4-k:#f1f7ff;--v4-k2:#cbdcf4;--v4-shadow:0 10px 28px rgba(32,47,75,.08)}
html{scroll-behavior:smooth}body{overflow-x:hidden}.wrap{max-width:1440px;padding:28px 24px 56px}h1{font-size:clamp(28px,3vw,42px);letter-spacing:-.02em}.lead{max-width:900px;font-size:17px}.legend{margin-bottom:4px}
.toolbar{position:sticky;top:0;z-index:30;margin:16px 0 24px;padding:12px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border:1px solid var(--v4-line);border-radius:18px;box-shadow:0 8px 24px rgba(38,52,78,.1)}
.search{height:44px;flex:1;min-width:260px}.toolbar button,.toolbar select{min-height:44px;font-weight:700}.status{margin-left:auto;white-space:nowrap}
.tablebox{overflow:visible;background:transparent;border:0;border-radius:0;box-shadow:none}table,tbody{display:block;width:100%;min-width:0}thead{display:none!important}tbody{display:grid;gap:16px}
tr{display:grid;grid-template-columns:90px minmax(0,1fr) 90px minmax(0,1fr);position:relative;overflow:hidden;background:#fff;border:1px solid var(--v4-line);border-radius:20px;box-shadow:var(--v4-shadow)}
td{border:0!important;padding:18px;min-width:0}.group{grid-column:1/-1;width:auto;background:#fff4c7;padding:8px 15px;text-align:left;font-size:14px;border-bottom:1px solid #eadb98!important}.group:empty{display:none}
.kana{width:auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:7px;padding:18px 10px;font-size:48px;line-height:1;font-weight:900}.kana::before{display:block;font-size:11px;line-height:1.2;letter-spacing:.08em;font-weight:850;padding:5px 8px;border:1px solid currentColor;border-radius:999px;margin-bottom:3px}.kana.hcell::before{content:'平假名';color:#a84b5e}.kana.kcell::before{content:'片假名';color:#426a9e}
tr>td:nth-child(2){border-right:1px solid var(--v4-h2)!important}tr>td:nth-child(3){border-right:1px solid var(--v4-line)!important}tr>td:nth-child(4){border-right:1px solid var(--v4-k2)!important}.hcell{background:var(--v4-h)}.kcell{background:var(--v4-k)}
.word-title{font-size:23px;line-height:1.35}.word-meta{font-size:14px;line-height:1.7;margin-top:7px}.romaji{font-weight:800}.sound{border-radius:999px;background:#fff;border-color:#cbd6e4;font-weight:750}.sound:hover{background:#edf4fc}
details{margin-top:13px;border-radius:13px;background:rgba(255,255,255,.82)}summary{padding:12px 14px;font-size:15px}summary::before{width:22px}.lesson{padding:2px 14px 15px}.sentence{font-size:20px}.reading,.full-romaji,.translation{line-height:1.7}.tokens{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.token{min-width:0;background:#fff;padding:10px;border-radius:11px}.token-surface{overflow-wrap:anywhere}.token-reading,.token-romaji,.token-meaning{overflow-wrap:anywhere}
.note{margin-top:24px;border-radius:18px;padding:18px 20px}
@media(max-width:980px){.toolbar{position:static}.status{width:100%;margin-left:0}.wrap{padding:20px 16px 44px}tr{grid-template-columns:76px minmax(0,1fr)}tr>td:nth-child(2),tr>td:nth-child(4){border-right:1px solid var(--v4-line)!important}tr>td:nth-child(3){border-right:0!important;border-bottom:1px solid var(--v4-line)!important}.kana{font-size:42px}.group{grid-column:1/-1}}
@media(max-width:620px){.wrap{padding:14px 12px 36px}h1{font-size:27px}.lead{font-size:15px}.legend{display:grid}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}.search{grid-column:1/-1;min-width:0;width:100%}.toolbar button,.toolbar select{width:100%;padding:7px 8px;font-size:14px}.status{grid-column:1/-1}.kana{font-size:38px;padding:15px 7px}td{padding:15px 12px}.word-title{font-size:20px}.tokens{grid-template-columns:1fr 1fr}.sentence{font-size:18px}}
@media(max-width:420px){.toolbar{grid-template-columns:1fr}.search,.status{grid-column:auto}.tokens{grid-template-columns:1fr}tr{grid-template-columns:66px minmax(0,1fr)}}
@media print{.toolbar,.legend,.note,.sound{display:none!important}.wrap{padding:0}tbody{gap:8px}tr{box-shadow:none;break-inside:avoid}.kana{font-size:24px}details{display:none}}`;
        const cssLiteral=JSON.stringify(css);
        const target='document.write(page);';
        const replacement=`document.write(page.replace('</head>','<style id="layout-v4">'+${cssLiteral}+'</style></head>'));`;
        if(!page.includes(target)) throw new Error('patch');
        page=page.replace(target,replacement);
        document.open();
        document.write(page);
        document.close();
      }catch(error){
        document.getElementById('loading').innerHTML='頁面載入失敗，請重新整理後再試一次。';
      }
    })();
  </script>
</body>
</html>
