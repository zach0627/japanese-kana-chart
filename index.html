<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="日本50音平假名片假名、生活例句、逐詞讀音與發音練習表">
  <title>日本50音生活例句互動背誦表</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Noto Sans JP",sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#f5f7fb;color:#172033}
    #loading{padding:24px;text-align:center;line-height:1.7}
  </style>
</head>
<body>
  <div id="loading">正在載入日本50音互動背誦表…</div>
  <script>
    (async()=>{
      try{
        const version='20260724-layout-fix-2';
        const paths=['001','002','003','004','005'].map(n=>`chunks/part-${n}?v=${version}`);
        const responses=await Promise.all(paths.map(path=>fetch(path,{cache:'no-store'})));
        if(responses.some(response=>!response.ok))throw new Error('chunk load failed');
        let page=(await Promise.all(responses.map(response=>response.text()))).join('');
        const layoutFix=`<style id="layout-fix-2">
:root{--fix-line:#dce3ed;--fix-h:#fff4f6;--fix-h-border:#f3cbd3;--fix-k:#f1f7ff;--fix-k-border:#cbdcf4;--fix-shadow:0 10px 28px rgba(32,47,75,.08)}
html{scroll-behavior:smooth}body{overflow-x:hidden!important;background:#f5f7fb!important}.wrap{max-width:1440px!important;margin:0 auto!important;padding:28px 24px 56px!important}h1{font-size:clamp(28px,3vw,42px)!important;letter-spacing:-.02em!important;margin-bottom:10px!important}.lead{max-width:980px!important;font-size:17px!important;line-height:1.75!important}.legend{margin-bottom:4px!important}
.toolbar{position:static!important;top:auto!important;z-index:auto!important;margin:18px 0 22px!important;padding:12px!important;background:#fff!important;border:1px solid var(--fix-line)!important;border-radius:18px!important;box-shadow:0 8px 24px rgba(38,52,78,.08)!important;backdrop-filter:none!important}.search{height:44px!important;flex:1!important;min-width:260px!important}.toolbar button,.toolbar select{min-height:44px!important;font-weight:700!important}.status{margin-left:auto!important;white-space:nowrap!important}
.tablebox{overflow:visible!important;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important}table,tbody{display:block!important;width:100%!important;min-width:0!important;border-collapse:separate!important}thead,thead tr,thead th,th{display:none!important;position:static!important;top:auto!important;height:0!important;min-height:0!important;padding:0!important;margin:0!important;border:0!important}tbody{display:grid!important;gap:16px!important}
tr{display:grid!important;grid-template-columns:90px minmax(0,1fr) 90px minmax(0,1fr)!important;position:relative!important;overflow:hidden!important;background:#fff!important;border:1px solid var(--fix-line)!important;border-radius:20px!important;box-shadow:var(--fix-shadow)!important}td{border:0!important;padding:18px!important;min-width:0!important;position:static!important}.group{grid-column:1/-1!important;width:auto!important;background:#fff4c7!important;padding:8px 15px!important;text-align:left!important;font-size:14px!important;border-bottom:1px solid #eadb98!important}.group:empty{display:none!important}
.kana{width:auto!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:flex-start!important;gap:7px!important;padding:18px 10px!important;font-size:48px!important;line-height:1!important;font-weight:900!important}.kana::before{display:block!important;font-size:11px!important;line-height:1.2!important;letter-spacing:.08em!important;font-weight:850!important;padding:5px 8px!important;border:1px solid currentColor!important;border-radius:999px!important;margin-bottom:3px!important}.kana.hcell::before{content:'平假名'!important;color:#a84b5e!important}.kana.kcell::before{content:'片假名'!important;color:#426a9e!important}
tr>td:nth-child(2){border-right:1px solid var(--fix-h-border)!important}tr>td:nth-child(3){border-right:1px solid var(--fix-line)!important}tr>td:nth-child(4){border-right:1px solid var(--fix-k-border)!important}.hcell{background:var(--fix-h)!important}.kcell{background:var(--fix-k)!important}.word-title{font-size:23px!important;line-height:1.35!important}.word-meta{font-size:14px!important;line-height:1.7!important;margin-top:7px!important}.romaji{font-weight:800!important}.sound{border-radius:999px!important;background:#fff!important;border-color:#cbd6e4!important;font-weight:750!important}.sound:hover{background:#edf4fc!important}
details{margin-top:13px!important;border-radius:13px!important;background:rgba(255,255,255,.82)!important}summary{padding:12px 14px!important;font-size:15px!important}summary::before{width:22px!important}.lesson{padding:2px 14px 15px!important}.sentence{font-size:20px!important}.reading,.full-romaji,.translation{line-height:1.7!important}.tokens{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(145px,1fr))!important;gap:8px!important}.token{min-width:0!important;background:#fff!important;padding:10px!important;border-radius:11px!important}.token-surface,.token-reading,.token-romaji,.token-meaning{overflow-wrap:anywhere!important}.note{margin-top:24px!important;border-radius:18px!important;padding:18px 20px!important}
@media(max-width:980px){.status{width:100%!important;margin-left:0!important}.wrap{padding:20px 16px 44px!important}tr{grid-template-columns:76px minmax(0,1fr)!important}tr>td:nth-child(2),tr>td:nth-child(4){border-right:1px solid var(--fix-line)!important}tr>td:nth-child(3){border-right:0!important;border-bottom:1px solid var(--fix-line)!important}.kana{font-size:42px!important}.group{grid-column:1/-1!important}}
@media(max-width:620px){.wrap{padding:14px 12px 36px!important}h1{font-size:27px!important}.lead{font-size:15px!important}.legend{display:grid!important}.toolbar{display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important;padding:10px!important}.search{grid-column:1/-1!important;min-width:0!important;width:100%!important}.toolbar button,.toolbar select{width:100%!important;padding:7px 8px!important;font-size:14px!important}.status{grid-column:1/-1!important}.kana{font-size:38px!important;padding:15px 7px!important}td{padding:15px 12px!important}.word-title{font-size:20px!important}.tokens{grid-template-columns:1fr 1fr!important}.sentence{font-size:18px!important}}
@media(max-width:420px){.search,.status{grid-column:1/-1!important}.tokens{grid-template-columns:1fr!important}tr{grid-template-columns:66px minmax(0,1fr)!important}}
@media(max-width:340px){.toolbar{grid-template-columns:1fr!important}.search,.status{grid-column:auto!important}}
@media print{.toolbar,.legend,.note,.sound{display:none!important}.wrap{padding:0!important}tbody{gap:8px!important}tr{box-shadow:none!important;break-inside:avoid!important}.kana{font-size:24px!important}details{display:none!important}}
</style>`;
        if(!page.includes('</head>'))throw new Error('invalid page');
        page=page.replace('</head>',layoutFix+'</head>');
        document.open();document.write(page);document.close();
      }catch(error){document.getElementById('loading').innerHTML='頁面載入失敗，請重新整理後再試一次。';console.error(error)}
    })();
  </script>
</body>
</html>
