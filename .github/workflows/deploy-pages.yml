name: Deploy Japanese Kana Chart

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build fixed static page
        shell: bash
        run: |
          mkdir -p _site
          cat chunks/part-* > _site/index.html
          cp layout-v4.css _site/layout-v4.css
          python - <<'PY'
          from pathlib import Path

          path = Path('_site/index.html')
          page = path.read_text(encoding='utf-8')
          stylesheet = '<link rel="stylesheet" href="layout-v4.css?v=20260724-final-header-fix">'
          cleanup = '''<script id="remove-legacy-table-header">
          (() => {
            const removeHeader = () => {
              document.querySelectorAll('thead').forEach(node => node.remove());
              document.querySelectorAll('.toolbar').forEach(node => {
                node.style.setProperty('position', 'static', 'important');
                node.style.setProperty('top', 'auto', 'important');
                node.style.setProperty('z-index', 'auto', 'important');
              });
              document.querySelectorAll('th').forEach(node => {
                node.style.setProperty('position', 'static', 'important');
                node.style.setProperty('top', 'auto', 'important');
              });
            };
            removeHeader();
            document.addEventListener('DOMContentLoaded', removeHeader, { once: true });
            new MutationObserver(removeHeader).observe(document.documentElement, { childList: true, subtree: true });
          })();
          </script>'''
          if '</head>' not in page or '</body>' not in page:
              raise SystemExit('Invalid assembled HTML')
          page = page.replace('</head>', stylesheet + '</head>', 1)
          page = page.replace('</body>', cleanup + '</body>', 1)
          path.write_text(page, encoding='utf-8')
          PY
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/layout-v4.css
          grep -q 'layout-v4.css?v=20260724-final-header-fix' _site/index.html
          grep -q 'remove-legacy-table-header' _site/index.html
          grep -q 'thead,thead tr,thead th{display:none!important' _site/layout-v4.css

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
